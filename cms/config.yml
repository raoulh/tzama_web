# Configuration de Sveltia CMS, servie sur /cms/config.yml. Guide : cms/README.md.
# Les champs obligatoires suivent site/layouts/_partials/validate.html : modifier les deux ensemble.

backend:
  name: github
  repo: raoulh/tzama_web
  branch: main
  base_url: https://deploy.tzama.fr
  auth_endpoint: auth
  # Le relais OAuth impose public_repo ; le demander évite un écran d'autorisation trompeur.
  auth_scope: public_repo
  # Pas de saisie de jeton personnel : la connexion passe toujours par le relais.
  auth_methods: [oauth]
  # Environnement des déploiements de preview créés par .github/workflows/site.yml.
  preview_context: preview
  commit_messages:
    create: "Création de {{collection}} « {{slug}} »"
    update: "Modification de {{collection}} « {{slug}} »"
    delete: "Suppression de {{collection}} « {{slug}} »"
    uploadMedia: "Ajout du fichier « {{path}} »"
    deleteMedia: "Suppression du fichier « {{path}} »"

# Chaque modification ouvre une pull request ; la preview sert de relecture avant publication.
publish_mode: editorial_workflow

app_title: Gestion du site Tzama
site_url: https://v2.tzama.fr
show_preview_links: true

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Exigé par Sveltia, mais aucun champ ne s'en sert : les images vivent dans le dossier de leur fiche.
media_folder: site/static/medias
public_folder: /medias

media_libraries:
  default:
    config:
      max_file_size: 15728640
      slugify_filename: true
      # Les photos de téléphone sont réduites et converties en WebP dans le navigateur avant l'envoi.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000
  # Photos réelles de l'école uniquement.
  stock_assets: false

output:
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [fr]
  default_locale: fr

collections:
  - name: pages
    label: Pages
    description: Les pages du site, découpées en sections (texte, listes, formulaire…).
    icon: web
    i18n: true
    files:
      - name: ecole
        label: L'école
        file: site/content/{{locale}}/ecole/_index.md
        i18n: true
        media_folder: ""
        public_folder: ""
        preview_path: ecole/
        fields:
          - &page_title
            name: title
            i18n: true
            label: Titre de la page
            hint: Le grand titre en haut de la page.
          - &page_description
            name: description
            i18n: true
            label: Description pour les moteurs de recherche
            widget: text
            required: false
            hint: Une ou deux phrases, affichées dans les résultats de recherche.
          - &page_sections
            name: sections
            i18n: true
            label: Sections de la page
            label_singular: section
            widget: list
            typeKey: type
            min: 1
            summary: "{{title}}"
            hint: >-
              Les sections s'affichent dans cet ordre, de haut en bas. Le type d'une section décide de ses champs.
            types:
              - name: text
                label: Texte
                widget: object
                summary: "{{title}}"
                fields:
                  - &sec_title
                    name: title
                    label: Titre de la section
                  - &sec_id
                    name: id
                    label: Ancre (repère dans l'adresse)
                    pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Minuscules, chiffres et tirets seulement, sans espace ni accent"]
                    hint: >-
                      À ne pas changer pour une section existante : le menu et les liens du site renvoient
                      à cette ancre. Pour une nouvelle section, minuscules, chiffres et tirets
                      (par exemple « mon-projet »), unique dans la page.
                  - &sec_body
                    name: body
                    label: Texte
                    widget: markdown
                    required: false
                    editor_components: []
                  - &sec_photo
                    name: photo
                    label: Photo
                    widget: image
                    required: false
                    accept: image/jpeg,image/png,image/webp
                    choose_url: false
                    hint: Photo réelle de l'école, affichée à côté du texte. JPEG, PNG ou WebP, 15 Mo au plus.
                  - &sec_photo_alt
                    name: photo_alt
                    label: Description de la photo
                    required: false
                    hint: >-
                      Obligatoire dès qu'une photo est ajoutée, sinon la preview échoue.
                      Décrire ce que montre la photo, en une phrase : ce texte est lu aux personnes aveugles.
                  - &sec_draft
                    name: draft_note
                    label: Texte provisoire
                    widget: text
                    required: false
                    hint: >-
                      Encadré « Texte provisoire » visible seulement en prévisualisation, jamais sur le site publié.
                      Sert à signaler ce qui reste à fournir. Le vider quand le texte est définitif.
              - name: team
                label: Équipe ou CA
                widget: object
                summary: "{{title}}"
                hint: Les portraits viennent de la collection « Équipe et CA ».
                fields:
                  - *sec_title
                  - *sec_id
                  - name: group
                    label: Groupe affiché
                    widget: select
                    default: equipe
                    options:
                      - { label: Équipe de l'école, value: equipe }
                      - { label: Conseil d'administration, value: ca }
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: faq
                label: Questions fréquentes
                widget: object
                summary: "{{title}}"
                hint: Les questions viennent de la collection « Questions fréquentes ».
                fields:
                  - *sec_title
                  - *sec_id
                  - name: category
                    label: Rubrique affichée
                    widget: select
                    default: ecole
                    options:
                      - { label: L'école, value: ecole }
                      - { label: Vie quotidienne, value: vie-quotidienne }
                      - { label: Inscription, value: inscription }
                      - { label: L'association, value: association }
                      - { label: Extrascolaire, value: extrascolaire }
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: figures
                label: Chiffres
                widget: object
                summary: "{{title}}"
                fields:
                  - *sec_title
                  - *sec_id
                  - name: items
                    label: Chiffres
                    label_singular: chiffre
                    widget: list
                    min: 1
                    summary: "{{label}}"
                    fields:
                      - name: value
                        label: Valeur
                        required: false
                        hint: Par exemple « 25 ». À laisser vide si le chiffre est calculé.
                      - name: label
                        label: Légende
                        required: false
                        hint: Obligatoire avec une valeur. Facultative pour un chiffre calculé.
                      - name: compute
                        label: Chiffre calculé
                        widget: select
                        required: false
                        hint: Remplace la valeur par un nombre recalculé à chaque mise en ligne.
                        options:
                          - { label: Années depuis l'ouverture, value: years }
                          - { label: Nombre de membres de l'équipe, value: staff }
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: partners
                label: Partenaires
                widget: object
                summary: "{{title}}"
                hint: Les logos viennent de la collection « Partenaires ».
                fields:
                  - *sec_title
                  - *sec_id
                  - name: category
                    label: Catégorie affichée
                    widget: select
                    default: pedagogique
                    options:
                      - { label: Pédagogique, value: pedagogique }
                      - { label: Territoire, value: territoire }
                      - { label: Associatif, value: associatif }
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: events
                label: Événements
                widget: object
                summary: "{{title}}"
                hint: Les événements viennent de la collection « Événements ».
                fields:
                  - *sec_title
                  - *sec_id
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: documents
                label: Documents à télécharger
                widget: object
                summary: "{{title}}"
                hint: Les PDF viennent de la collection « Documents ».
                fields:
                  - *sec_title
                  - *sec_id
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: schedule
                label: Semaine type par cycle
                widget: object
                summary: "{{title}}"
                fields:
                  - *sec_title
                  - *sec_id
                  - name: cycles
                    label: Cycles
                    label_singular: cycle
                    widget: list
                    min: 1
                    summary: "{{name}}"
                    fields:
                      - { name: name, label: Nom du cycle }
                      - name: ages
                        label: Âges
                        required: false
                        hint: Par exemple « de 3 à 6 ans ».
                      - name: body
                        label: Planning de la semaine
                        widget: markdown
                        required: false
                        editor_components: []
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: pricing
                label: Tarifs
                widget: object
                summary: "{{title}}"
                hint: Les montants se modifient dans « Réglages du site », jamais ici.
                fields:
                  - *sec_title
                  - *sec_id
                  - name: scope
                    label: Tarifs affichés
                    widget: select
                    required: false
                    default: ecole
                    options:
                      - { label: Scolarité, value: ecole }
                      - { label: Club nature, value: club_nature }
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: steps
                label: Étapes
                widget: object
                summary: "{{title}}"
                fields:
                  - *sec_title
                  - *sec_id
                  - name: steps
                    label: Étapes
                    label_singular: étape
                    widget: list
                    min: 1
                    summary: "{{title}}"
                    fields:
                      - { name: title, label: Titre de l'étape }
                      - name: body
                        label: Explication
                        widget: markdown
                        required: false
                        editor_components: []
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: stages
                label: Stages à venir
                widget: object
                summary: "{{title}}"
                hint: Les stages viennent de la collection « Stages ».
                fields:
                  - *sec_title
                  - *sec_id
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: jobs
                label: Postes ouverts
                widget: object
                summary: "{{title}}"
                hint: Les postes viennent de la collection « Postes ».
                fields:
                  - *sec_title
                  - *sec_id
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: donate
                label: Don
                widget: object
                summary: "{{title}}"
                hint: Le lien du formulaire de don se règle dans « Réglages du site ».
                fields:
                  - *sec_title
                  - *sec_id
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: contact_form
                label: Formulaire de contact
                widget: object
                summary: "{{title}}"
                fields:
                  - *sec_title
                  - *sec_id
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft
              - name: video
                label: Vidéos YouTube
                widget: object
                summary: "{{title}}"
                fields:
                  - *sec_title
                  - *sec_id
                  - name: videos
                    label: Vidéos
                    label_singular: vidéo
                    widget: list
                    min: 1
                    summary: "{{title}}"
                    fields:
                      - name: id
                        label: Identifiant YouTube
                        pattern: ['^[A-Za-z0-9_-]{11}$', "11 caractères : lettres, chiffres, - et _"]
                        hint: Les 11 caractères après « v= » dans l'adresse de la vidéo.
                      - { name: title, label: Titre de la vidéo }
                  - *sec_body
                  - *sec_photo
                  - *sec_photo_alt
                  - *sec_draft

      - name: inscription
        label: Inscription
        file: site/content/{{locale}}/inscription/_index.md
        i18n: true
        media_folder: ""
        public_folder: ""
        preview_path: inscription/
        fields:
          - *page_title
          - *page_description
          - *page_sections

      - name: extrascolaire
        label: Extrascolaire
        file: site/content/{{locale}}/extrascolaire/index.md
        i18n: true
        media_folder: ""
        public_folder: ""
        preview_path: extrascolaire/
        fields:
          - *page_title
          - *page_description
          - *page_sections

      - name: association
        label: L'association
        file: site/content/{{locale}}/association/_index.md
        i18n: true
        media_folder: ""
        public_folder: ""
        preview_path: association/
        fields:
          - *page_title
          - *page_description
          - *page_sections

      - name: contact
        label: Contact
        file: site/content/{{locale}}/contact/_index.md
        i18n: true
        media_folder: ""
        public_folder: ""
        preview_path: contact/
        fields:
          - *page_title
          - *page_description
          - *page_sections

      - name: accueil
        label: Accueil
        file: site/content/{{locale}}/_index.md
        i18n: true
        # Les images de l'accueil sont des ressources de assets/, pas du dossier de la page.
        media_folder: site/assets/img/accueil
        public_folder: img/accueil
        preview_path: /
        fields:
          # À ajouter après le merge de la PR de l'accueil : « Pourquoi choisir Tzama »,
          # journée en quatre moments, carrousel (champs : voir validate.html).
          - name: hero
            i18n: true
            label: En-tête
            widget: object
            fields:
              - name: image
                label: Grande photo
                widget: image
                accept: image/jpeg,image/png,image/webp
                choose_url: false
              - { name: image_alt, label: Description de la grande photo }
              - name: tagline
                label: Phrase d'accroche
                widget: text
              - { name: intro, label: Introduction, widget: text }
              - name: photos
                label: Photos « polaroid »
                label_singular: photo
                widget: list
                required: false
                summary: "{{caption}}"
                fields:
                  - name: image
                    label: Photo
                    widget: image
                    accept: image/jpeg,image/png,image/webp
                    choose_url: false
                  - { name: alt, label: Description de la photo }
                  - { name: caption, label: Légende }
          - name: words
            i18n: true
            label: « Tzama en trois mots »
            widget: object
            fields:
              - { name: title, label: Titre }
              - &home_items
                name: items
                label: Éléments
                label_singular: élément
                widget: list
                min: 1
                summary: "{{title}}"
                fields:
                  - { name: title, label: Titre }
                  - { name: text, label: Texte, widget: text }
          - name: day
            i18n: true
            label: « Une journée à Tzama »
            widget: object
            fields:
              - { name: title, label: Titre }
              - *home_items
              - name: photo
                label: Photo
                widget: image
                accept: image/jpeg,image/png,image/webp
                choose_url: false
              - { name: photo_alt, label: Description de la photo }
              - { name: photo_caption, label: Légende de la photo }
          - name: support
            i18n: true
            label: Soutenir l'école
            widget: object
            fields:
              - { name: text, label: Texte, widget: text }
          - name: visit
            i18n: true
            label: « Venir voir »
            widget: object
            fields:
              - { name: title, label: Titre }
              - name: text
                label: Paragraphes
                label_singular: paragraphe
                widget: list
                min: 1
                field: { name: paragraph, label: Paragraphe, widget: text }
              - name: photo
                label: Photo
                widget: image
                accept: image/jpeg,image/png,image/webp
                choose_url: false
              - { name: photo_alt, label: Description de la photo }
              - { name: photo_caption, label: Légende de la photo }

  - name: actualites
    label: Actualités
    label_singular: actualité
    description: Annonces et événements, du plus récent au plus ancien.
    icon: newspaper
    folder: site/content/{{locale}}/actualites
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    create: true
    identifier_field: title
    summary: "{{title}} · {{date | date('DD/MM/YYYY')}}"
    thumbnail: flyer
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    preview_path: actualites/{{slug}}/
    fields:
      - name: title
        i18n: true
        label: Titre
      - name: summary
        i18n: true
        label: Résumé
        widget: text
        hint: Une ou deux phrases, affichées sur la carte de l'actualité et en tête de la page.
      - name: date
        i18n: duplicate
        label: Date de publication
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
        hint: Sert au classement des actualités.
      - name: event_date
        i18n: duplicate
        label: Date de l'événement
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
        hint: Seulement si l'actualité annonce un événement.
      - name: pinned
        i18n: duplicate
        label: Épingler en tête de liste
        widget: boolean
        default: false
      - name: flyer
        i18n: duplicate
        label: Image ou flyer
        widget: image
        required: false
        accept: image/jpeg,image/png,image/webp
        choose_url: false
        hint: JPEG, PNG ou WebP, 15 Mo au plus. L'image est réduite automatiquement.
      - name: flyer_alt
        i18n: true
        label: Description de l'image
        required: false
        hint: >-
          **Obligatoire dès qu'une image est ajoutée**, sinon la preview échoue.
          Décrire ce que montre l'image, en une phrase : ce texte est lu aux personnes aveugles
          et s'affiche si l'image ne charge pas.
      - name: body
        i18n: true
        label: Texte
        widget: markdown
        required: false
        editor_components: []

  - name: equipe
    label: Équipe et CA
    label_singular: personne
    description: L'équipe de l'école et les membres du conseil d'administration.
    icon: groups
    folder: site/content/{{locale}}/equipe
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}} · {{role}}"
    thumbnail: photo
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    view_groups:
      - { label: Groupe, field: group }
    fields:
      - name: name
        i18n: duplicate
        label: Prénom et nom
      - name: role
        i18n: true
        label: Rôle
        hint: Par exemple « Enseignante, cycle 2 » ou « Trésorerie ».
      - name: group
        i18n: duplicate
        label: Groupe
        widget: select
        default: equipe
        options:
          - { label: Équipe de l'école, value: equipe }
          - { label: Conseil d'administration, value: ca }
      - name: order
        i18n: duplicate
        label: Ordre d'affichage
        widget: number
        value_type: int
        default: 99
        min: 1
        hint: Les plus petits nombres s'affichent en premier dans leur groupe.
      - name: photo
        i18n: duplicate
        label: Photo
        widget: image
        required: false
        accept: image/jpeg,image/png,image/webp
        choose_url: false
        hint: Sans photo, un portrait générique s'affiche. JPEG, PNG ou WebP, 15 Mo au plus.
      - name: photo_alt
        i18n: true
        label: Description de la photo
        required: false
        hint: >-
          **Obligatoire dès qu'une photo est ajoutée**, sinon la preview échoue.
          Par exemple « Portrait de Claire, souriante, dans le jardin » : ce texte est lu aux
          personnes aveugles.
      # Hugo lit `title` ; il reprend le nom pour ne pas le saisir deux fois.
      - name: title
        i18n: true
        label: Titre de la fiche
        widget: compute
        value: "{{fields.name}}"

  - name: partenaires
    label: Partenaires
    label_singular: partenaire
    icon: handshake
    folder: site/content/{{locale}}/partenaires
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}} · {{category}}"
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    view_groups:
      - { label: Catégorie, field: category }
    preview_path: ecole/
    fields:
      - name: name
        i18n: duplicate
        label: Nom
      - name: category
        i18n: duplicate
        label: Catégorie
        widget: select
        default: pedagogique
        options:
          - { label: Pédagogique, value: pedagogique }
          - { label: Territoire, value: territoire }
          - { label: Associatif, value: associatif }
      - name: order
        i18n: duplicate
        label: Ordre d'affichage
        widget: number
        value_type: int
        default: 99
        min: 1
        hint: Les plus petits nombres s'affichent en premier dans leur catégorie.
      - name: website
        i18n: duplicate
        label: Site web
        required: false
        pattern: ['^https://', "Le lien doit commencer par https://"]
      - name: logo
        i18n: duplicate
        label: Logo
        widget: image
        required: false
        accept: image/jpeg,image/png,image/webp
        choose_url: false
        hint: Sans logo, le nom seul s'affiche. JPEG, PNG ou WebP, 15 Mo au plus.
      - name: logo_alt
        i18n: true
        label: Description du logo
        required: false
        hint: >-
          Obligatoire dès qu'un logo est ajouté, sinon la preview échoue.
          Par exemple « Logo de l'Archipel de Kembs ».
      - name: body
        i18n: true
        label: Présentation
        widget: markdown
        required: false
        editor_components: []
      # Hugo lit `title` ; il reprend le nom pour ne pas le saisir deux fois.
      - name: title
        i18n: true
        label: Titre de la fiche
        widget: compute
        value: "{{fields.name}}"

  - name: evenements
    label: Événements
    label_singular: événement
    icon: event
    folder: site/content/{{locale}}/evenements
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    create: true
    identifier_field: title
    summary: "{{title}} · {{period}}"
    sortable_fields:
      fields: [order, title]
      default: { field: order, direction: ascending }
    preview_path: association/
    fields:
      - name: title
        i18n: true
        label: Nom de l'événement
      - name: period
        i18n: true
        label: Période
        hint: Texte affiché, par exemple « Au printemps » ou « Début décembre ».
      - name: order
        i18n: duplicate
        label: Ordre d'affichage
        widget: number
        value_type: int
        default: 99
        min: 1
        hint: Les plus petits nombres s'affichent en premier.
      - name: photo
        i18n: duplicate
        label: Photo
        widget: image
        required: false
        accept: image/jpeg,image/png,image/webp
        choose_url: false
        hint: Photo réelle de l'événement. JPEG, PNG ou WebP, 15 Mo au plus.
      - name: photo_alt
        i18n: true
        label: Description de la photo
        required: false
        hint: >-
          Obligatoire dès qu'une photo est ajoutée, sinon la preview échoue.
          Décrire ce que montre la photo, en une phrase.
      - name: body
        i18n: true
        label: Description
        widget: markdown
        required: false
        editor_components: []

  - name: documents
    label: Documents
    label_singular: document
    icon: description
    folder: site/content/{{locale}}/documents
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    create: true
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [order, title]
      default: { field: order, direction: ascending }
    preview_path: inscription/
    fields:
      - name: title
        i18n: true
        label: Titre du document
        hint: Le texte du lien de téléchargement, par exemple « Règlement intérieur ».
      - name: file
        i18n: duplicate
        label: Fichier PDF
        widget: file
        accept: application/pdf
        choose_url: false
        media_libraries:
          default:
            config:
              max_file_size: 10485760
        hint: Un fichier PDF, 10 Mo au plus.
      - name: description
        i18n: true
        label: Description
        widget: text
        required: false
        hint: Une phrase affichée sous le lien.
      - name: order
        i18n: duplicate
        label: Ordre d'affichage
        widget: number
        value_type: int
        default: 99
        min: 1
        hint: Les plus petits nombres s'affichent en premier.

  - name: stages
    label: Stages
    label_singular: stage
    description: Stages de vacances proposés aux enfants.
    icon: forest
    folder: site/content/{{locale}}/stages
    i18n: true
    create: true
    identifier_field: title
    summary: "{{title}} · {{dates}}"
    sortable_fields:
      fields: [start_date, title]
      default: { field: start_date, direction: descending }
    fields:
      - name: title
        i18n: true
        label: Nom du stage
      - name: start_date
        i18n: duplicate
        label: Premier jour
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
        hint: Sert au tri et à masquer les stages passés.
      - name: dates
        i18n: true
        label: Dates et horaires affichés
        hint: Par exemple « Du lundi 26 au vendredi 30 octobre, de 9 h à 12 h ».
      - name: ages
        i18n: true
        label: Âges
        hint: Par exemple « 3 à 10 ans ».
      - name: price
        i18n: true
        label: Tarif particulier
        required: false
        hint: À laisser vide pour afficher le tarif habituel des réglages du site.
      - name: registration_url
        i18n: duplicate
        label: Lien d'inscription
        pattern: ['^(https://|mailto:)', "Le lien doit commencer par https:// ou mailto:"]
        hint: Lien HelloAsso, ou mailto:adresse@exemple.fr.
      - name: body
        i18n: true
        label: Description
        widget: markdown
        required: false
        editor_components: []

  - name: postes
    label: Postes
    label_singular: poste
    description: Offres d'emploi et de bénévolat.
    icon: work
    folder: site/content/{{locale}}/postes
    i18n: true
    create: true
    identifier_field: title
    summary: "{{title}}"
    view_groups:
      - { label: Statut, field: open }
    fields:
      - name: title
        i18n: true
        label: Intitulé du poste
        hint: Garder la mention « (F/H) ».
      - name: open
        i18n: duplicate
        label: Poste ouvert
        widget: boolean
        default: true
        hint: Décocher quand le poste est pourvu.
      - name: summary
        i18n: true
        label: Résumé
        widget: text
        hint: Une ou deux phrases.
      - name: contract
        i18n: true
        label: Type de contrat
        required: false
        hint: Par exemple CDD, CDI ou service civique.
      - name: body
        i18n: true
        label: Description du poste
        widget: markdown
        required: false
        editor_components: []

  - name: temoignages
    label: Témoignages
    label_singular: témoignage
    description: Paroles de parents et d'anciens élèves.
    icon: format_quote
    folder: site/content/{{locale}}/temoignages
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    create: true
    identifier_field: author
    slug: "{{author}}"
    summary: "{{author}}"
    thumbnail: photo
    sortable_fields:
      fields: [order, author]
      default: { field: order, direction: ascending }
    fields:
      - name: author
        i18n: true
        label: Auteur ou autrice
        hint: Tel qu'il s'affiche, par exemple « Julie, maman de Léo ».
      - name: relation
        i18n: duplicate
        label: Lien avec l'école
        widget: select
        default: parent
        options:
          - { label: Parent d'élève, value: parent }
          - { label: Ancien élève, value: former_pupil }
      - name: text
        i18n: true
        label: Témoignage
        widget: text
      - name: order
        i18n: duplicate
        label: Ordre d'affichage
        widget: number
        value_type: int
        default: 99
        min: 1
        hint: Les plus petits nombres s'affichent en premier.
      - name: placeholder
        i18n: duplicate
        label: Témoignage fictif
        widget: boolean
        default: false
        hint: Texte de démonstration, refusé par le site de production. Laisser décoché.
      - name: photo
        i18n: duplicate
        label: Photo
        widget: image
        required: false
        accept: image/jpeg,image/png,image/webp
        choose_url: false
        hint: Sans photo, un portrait générique s'affiche. JPEG, PNG ou WebP, 15 Mo au plus.
      - name: photo_alt
        i18n: true
        label: Description de la photo
        required: false
        hint: >-
          **Obligatoire dès qu'une photo est ajoutée**, sinon la preview échoue.
          Décrire la photo en une phrase : ce texte est lu aux personnes aveugles.
      # Hugo lit `title` ; il reprend l'auteur pour ne pas le saisir deux fois.
      - name: title
        i18n: true
        label: Titre de la fiche
        widget: compute
        value: "{{fields.author}}"

  - name: faq
    label: Questions fréquentes
    label_singular: question
    description: Questions et réponses de la page « Questions fréquentes ».
    icon: help
    folder: site/content/{{locale}}/faq
    i18n: true
    create: true
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [order, title]
      default: { field: order, direction: ascending }
    view_groups:
      - { label: Rubrique, field: category }
    fields:
      - name: title
        i18n: true
        label: Question
        hint: Formulée comme la poserait un parent, avec le point d'interrogation.
      - name: category
        i18n: duplicate
        label: Rubrique
        widget: select
        default: ecole
        options:
          - { label: L'école, value: ecole }
          - { label: Vie quotidienne, value: vie-quotidienne }
          - { label: Inscription, value: inscription }
          - { label: L'association, value: association }
          - { label: Extrascolaire, value: extrascolaire }
      - name: order
        i18n: duplicate
        label: Ordre dans la rubrique
        widget: number
        value_type: int
        default: 99
        min: 1
        hint: Les plus petits nombres s'affichent en premier.
      - name: body
        i18n: true
        label: Réponse
        widget: markdown
        required: false
        editor_components: []

  - name: reglages
    label: Réglages du site
    icon: settings
    files:
      - name: settings
        label: Coordonnées, tarifs et bandeau
        file: site/data/settings.yaml
        fields:
          - name: name
            label: Nom de l'association
            comment: "Coordonnées et liens communs à toutes les langues : seule source pour les gabarits."
          - name: email
            label: Adresse de contact
            pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Adresse e-mail invalide"]
          - name: phone
            label: Téléphone
            hint: Par exemple « 03 89 00 00 00 ».
          - name: opening_date
            label: Date d'ouverture de l'école
            widget: datetime
            type: date
            format: YYYY-MM-DD
            hint: Sert à calculer le nombre d'années d'existence.
          - name: address
            label: Adresse
            widget: object
            fields:
              - { name: street, label: Rue }
              - name: postalCode
                label: Code postal
                pattern: ['^[0-9]{5}$', "Cinq chiffres"]
              - { name: city, label: Ville }
          - name: social
            label: Réseaux sociaux
            label_singular: réseau
            widget: list
            summary: "{{id}}"
            fields:
              - name: id
                label: Réseau
                widget: select
                options:
                  - { label: Facebook, value: facebook }
                  - { label: Instagram, value: instagram }
                  - { label: YouTube, value: youtube }
              - name: url
                label: Adresse de la page
                pattern: ['^https://', "Le lien doit commencer par https://"]
          - name: donation_url
            label: Lien de don
            pattern: ['^https://', "Le lien doit commencer par https://"]
            hint: Adresse du formulaire HelloAsso, affiché dans la section de don de la page « L'association ».
          - name: pricing
            label: Tarifs
            widget: object
            comment: "Montants en euros, sans symbole : les gabarits mettent en forme."
            hint: Montants en euros, sans le symbole €.
            fields:
              - { name: school_year, label: Scolarité annuelle (€), widget: number, value_type: int, min: 0 }
              - name: monthly
                label: Paiement mensuel
                widget: object
                fields:
                  - { name: count, label: Nombre de mensualités, widget: number, value_type: int, min: 1 }
                  - { name: amount, label: Montant d'une mensualité (€), widget: number, value_type: int, min: 0 }
              - name: sibling_discount_percent
                label: Réduction fratrie (%)
                widget: number
                value_type: int
                min: 0
                max: 100
                hint: Appliquée dès le deuxième enfant.
              - name: club_nature
                label: Club nature
                widget: object
                fields:
                  - { name: year, label: Année (€), widget: number, value_type: int, min: 0 }
                  - { name: card_10, label: Carte de 10 séances (€), widget: number, value_type: int, min: 0 }
              - { name: stage_week, label: Semaine de stage (€), widget: number, value_type: int, min: 0 }
          # Un sous-champ par langue de hugo.yaml : le fichier de réglages est commun aux langues.
          - name: banner
            label: Bandeau d'annonce
            widget: object
            comment: "Une entrée par langue déclarée dans hugo.yaml ; bandeau masqué si enabled est faux."
            fields:
              - name: enabled
                label: Afficher le bandeau
                widget: boolean
                default: false
              - name: text
                label: Texte du bandeau
                widget: object
                fields:
                  - name: fr
                    label: Texte en français
                    widget: text
                    required: false
                    hint: Obligatoire si le bandeau est affiché.
