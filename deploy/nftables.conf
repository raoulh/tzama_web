#!/usr/sbin/nft -f
# Pas de « flush ruleset » : il effacerait les règles posées par Docker. On ne remplace que notre table.
table inet tzama_host
delete table inet tzama_host

table inet tzama_host {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 68 accept comment "renouvellement DHCP"
		tcp dport 22 accept
		# Le port 80 publié par Docker passe par la chaîne forward de Docker, pas par ici.
		# Le reste (dont Postfix sur 25, qui ne sert qu'aux envois locaux) est fermé.
	}
}
