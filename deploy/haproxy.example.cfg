# Extrait pour le HAProxy frontal : TLS terminé ici, tout le trafic tzama envoyé en HTTP à la VM,
# qui route selon le nom de domaine. Adapter les chemins de certificat et l'adresse de la VM.

frontend https
    bind :80
    bind :443 ssl crt /etc/ssl/letsencrypt/tzama.fr.pem alpn h2,http/1.1
    mode http
    http-request redirect scheme https code 301 unless { ssl_fc }
    # hosts.map : « v2.tzama.fr tzama », « test.tzama.fr tzama », « deploy.tzama.fr tzama », etc.
    use_backend %[req.hdr(host),lower,word(1,:),map(/etc/haproxy/hosts.map)]

backend tzama
    mode http
    # Caddy lit l'IP cliente dans X-Forwarded-For (trusted_proxies = cette machine). L'en-tête
    # envoyé par le client est d'abord supprimé : sinon il pourrait choisir l'IP vue par le
    # limiteur du formulaire de contact.
    http-request del-header X-Forwarded-For
    option forwardfor
    # Le webhook envoie une archive (5 min au plus côté deployd) puis attend son extraction.
    timeout server 10m
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-response set-header Strict-Transport-Security "max-age=31536000"
    server www <ip-de-la-vm>:80 check
