name: tzama

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80"]
    environment:
      HAPROXY_IP: ${HAPROXY_IP:?HAPROXY_IP manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  # Seul service à écrire dans sites/ ; joint uniquement par Caddy (aucun port publié).
  deployd:
    image: ghcr.io/raoulh/tzama-deployd:${DEPLOYD_TAG:-latest}
    restart: unless-stopped
    user: "${TZAMA_UID:?TZAMA_UID manquant dans .env}:${TZAMA_GID:?TZAMA_GID manquant dans .env}"
    env_file: deployd.env
    environment:
      SITES_DIR: /srv/sites
      STATE_DIR: /state
      # X-Real-IP posé par Caddy, seul client possible
      TRUST_PROXY: "true"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Shutdown laisse 2 minutes aux requêtes en cours.
    stop_grace_period: 2m15s
    volumes:
      - ./sites:/srv/sites
      - ./state:/state
    healthcheck:
      test: ["CMD", "/deployd", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
