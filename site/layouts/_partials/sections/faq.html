{{- /* category : questions de content/<langue>/faq/ de cette catégorie, triées par order. */ -}}
{{- with site.GetPage "/faq" }}
<div class="acc-grp">
  {{- range sort (where .RegularPages "Params.category" $.s.category) "Params.order" }}
  <details class="acc">
    <summary>{{ .Title }}</summary>
    <div class="acc__body">{{ .Content }}</div>
  </details>
  {{- end }}
</div>
{{- end }}
