# Surcharger en CLI pour les previews : hugo --baseURL https://test.tzama.fr/pr-<N>/
baseURL: https://v2.tzama.fr/
title: Tzama

defaultContentLanguage: fr
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
disableKinds: [taxonomy, term, rss]

module:
  hugoVersion:
    min: "0.162.0"
    extended: false
  # Déclarer un montage static remplace celui par défaut : il est répété.
  mounts:
    - { source: static, target: static }
    - { source: ../cms, target: static/cms, files: ["! README.md"] }

languages:
  fr:
    locale: fr-FR
    label: Français
    weight: 1
    contentDir: content/fr
    title: École Tzama
    params:
      description: École associative à Kembs (68) pour les enfants de 3 à 11 ans, la moitié du temps dehors.
      # Complète le titre de l'accueil dans les résultats de recherche.
      tagline: école alternative à Kembs (Haut-Rhin)
      ogImageAlt: Un groupe d'enfants et une adulte observent le sol en forêt, accroupis dans les feuilles.
    menus:
      # Une page par entrée ; ses sous-entrées sont les sections de la page (front matter « sections »).
      main:
        - identifier: ecole
          name: L'école
          pageRef: /ecole
          weight: 10
          params: { icon: d-feuille-simple }
        - identifier: inscription
          name: Inscription
          pageRef: /inscription
          weight: 20
          params: { icon: d-fleche-courbe }
        - identifier: extrascolaire
          name: Extrascolaire
          pageRef: /extrascolaire
          weight: 30
          params: { icon: d-soleil }
        - identifier: association
          name: L'association
          pageRef: /association
          weight: 40
          params: { icon: d-main-droite }
        - identifier: contact
          name: Contact
          pageRef: /contact
          weight: 50
          params: { icon: d-etoile }
      footer:
        - { name: Plan du site, pageRef: /plan-du-site, weight: 1 }
        - { name: Documents, pageRef: /inscription, params: { anchor: documents }, weight: 2 }
        - { name: Mentions légales, pageRef: /mentions-legales, weight: 3 }
        - { name: Confidentialité, pageRef: /confidentialite, weight: 4 }

params:
  # À retirer à la bascule, en même temps que baseURL (ici et dans la CI) passe à https://tzama.fr/.
  noindex: true
  # Seul domaine indexable : tout build vers un autre domaine (aperçus de PR, v2) reste en noindex.
  prodHost: tzama.fr
  # Image de partage (Open Graph) des pages qui n'en ont pas, recadrée en 1200×630.
  ogImage: img/accueil/decouverte-foret.jpg
  # Le build de production passe HUGO_PARAMS_STRICT=true : il refuse les témoignages fictifs.
  strict: false
  # Les aperçus de PR passent HUGO_PARAMS_PREVIEW=true : les erreurs de saisie s'affichent
  # en bandeau au lieu d'arrêter le build. Jamais en production.
  preview: false

markup:
  goldmark:
    renderer:
      unsafe: false
    parser:
      attribute:
        block: true
    # Les liens internes écrits dans le CMS (« /association/#ca ») suivent le baseURL des aperçus.
    renderHooks:
      link:
        useEmbedded: always

imaging:
  quality: 78
  resampleFilter: lanczos

minify:
  minifyOutput: true
